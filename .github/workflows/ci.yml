name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --shell=sh install.sh test/smoke-install.sh

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = @()
          foreach ($f in 'install.ps1', 'test/smoke-install.ps1') {
            $issues += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $issues | Format-Table -AutoSize -Wrap RuleName, ScriptName, Line, Message
          if ($issues.Count -gt 0) { exit 1 }

  smoke-install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh against a local fake release (python3 -m http.server; /bin/sh is dash on Ubuntu)
        run: sh test/smoke-install.sh

  smoke-install-sh-musl:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: install.sh refuses musl with a hint
        run: |
          if GAIADESK_INSTALL=/tmp/bin sh install.sh 2>err.txt; then echo "musl was not refused"; exit 1; fi
          cat err.txt
          grep -q 'musl libc' err.txt

  smoke-install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 against a local fake release (PowerShell 7)
        shell: pwsh
        run: ./test/smoke-install.ps1
      - name: install.ps1 against a local fake release (Windows PowerShell 5.1)
        shell: powershell
        run: ./test/smoke-install.ps1
